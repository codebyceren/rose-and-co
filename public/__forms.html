<!DOCTYPE html>
<html>
  <body>
    <!-- Netlify registers these forms at build time. Never shown to visitors. -->
    <form name="rezervasyon" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="ad" />
      <input type="tel" name="telefon" />
      <input type="email" name="eposta" />
      <input type="date" name="tarih" />
      <input type="text" name="saat" />
      <input type="number" name="kisi" />
      <input type="text" name="alan" />
      <textarea name="not"></textarea>
    </form>
    <form name="siparis" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="ad" />
      <input type="tel" name="telefon" />
      <input type="text" name="teslim-saati" />
      <textarea name="urunler"></textarea>
      <input type="text" name="toplam" />
    </form>
  </body>
</html>
